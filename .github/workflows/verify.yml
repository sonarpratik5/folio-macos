name: Verify native starter
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate context harness
        run: |
          python3 scripts/context.py --check
          python3 scripts/test_context.py
      - name: Test managed storage and PDF annotations
        run: swift test
      - name: Build source-only native app bundle (Skim weights not tracked)
        env:
          FOLIO_SOURCE_ONLY_BUILD: '1'
        run: scripts/build-app.sh release
